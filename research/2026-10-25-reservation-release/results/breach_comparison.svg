<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title description">
<title id="title">Reservation release: three separate safety measures</title>
<desc id="description">Synthetic finite model, 1680 cases per rule. Timeout: Actual budget breach 130, Exposure above budget 200, Uncovered A liability 560; ZeroObservation: Actual budget breach 105, Exposure above budget 175, Uncovered A liability 490; FenceOnly: Actual budget breach 55, Exposure above budget 70, Uncovered A liability 196; ClosureCertificate: Actual budget breach 0, Exposure above budget 0, Uncovered A liability 0; TerminalOnly: Actual budget breach 0, Exposure above budget 0, Uncovered A liability 0. Counts overlap and must not be added. These are not risk-rate estimates.</desc>
<rect width="1160" height="520" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a33}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#4a5560}.head{font-size:16px;font-weight:700}.rule{font-size:16px}.tick{font-size:12px;fill:#65717c}.value{font-size:15px;font-weight:700}.note{font-size:14px;fill:#4a5560}</style>
